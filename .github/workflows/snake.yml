# Gera a "cobrinha" que come o calendário de contribuições e publica o SVG no
# branch `output`. O README aponta para ele — por isso a imagem só aparece
# depois da primeira execução (leva ~1 minuto).
#
# Roda sozinha a cada 12 horas, a cada push na main e no botão "Run workflow".
name: snake

on:
  schedule:
    - cron: "0 */12 * * *"
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  gerar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Gerar o SVG da cobrinha
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#0084BF&color_dots=#0B3854,#0084BF,#38bdf8,#FDD008,#F81C9A

      - name: Publicar no branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
